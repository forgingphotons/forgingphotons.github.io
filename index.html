---
layout: default
title: Galleria
---
<div class="gallery">
  {% assign sorted_photos = site.photos | sort: "position" %}
  {% for photo in sorted_photos %}
  <a href="{{ photo.url | relative_url }}"
     class="gallery-item size-{{ photo.display_size | default: 'medium' }}">
    <img src="{{ photo.image | relative_url }}"
         alt="{{ photo.title }}"
         loading="lazy"
         style="object-position: {{ photo.focal_x | default: 'center' }} {{ photo.focal_y | default: 'center' }};">
    <div class="overlay">
      <span class="overlay-title">{{ photo.title }}</span>
      <span class="overlay-excerpt">{{ photo.content | strip_html | truncate: 110 }}</span>
    </div>
  </a>
  {% endfor %}
</div>
