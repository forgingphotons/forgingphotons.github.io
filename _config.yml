# Site settings
title: Forging Photons
email: "forgingphotons@gmail.com"
description: "Astrofotography - DIY"
url: "https://forgingphotons.github.io"
instagram_username: "marcogirardini"
share: true

# Owner/author information
owner:
  name:   Forging Photons
  avatar: logo.png
  favicon: favicon.ico
  info: astrofotography & DIY gears

# Settings for comments helper
# Set 'provider' to the comment provider you want to use. (i.e.  Disqus, Intense Debate, livefyre, or Facebook Comments)
# Set 'provider' to false to turn commenting off globally.
#Set 'provider: false' to disable comments globally.
# Disable comments for individual pages/posts by specifying 'comments: false' in the page/post YAML Front Matter.
#
#comments :
 # provider : disqus
  #disqus :
  #  short_name : ""

# Internal nav
nav:
  - NEBULAS: "https://forgingphotons.github.io/nebulas/"
  - GALAXIES: "https://forgingphotons.github.io/galaxies/"
  - CLUSTERS: "https://forgingphotons.github.io/clusters/"
  - SOLAR SYSTEM: "https://forgingphotons.github.io/solar-system/"
  - LANDSCAPES: "https://forgingphotons.github.io/landscapes/"
  - ABOUT: "https://forgingphotons.github.io/about/"

# All translation keys
translations:
 # 404.html
  permalink: "/404.html"

# Server
destination:      	 ./_site
port:             	 4000


# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
paginate: 5
paginate_path: "/journal/page:num/"
permalink: "/journal/:title/"
categories_path: "/journal/category/"
tags_path: "/journal/tag/"
gems: 
 - jekyll-paginate
exclude: ["less","node_modules","Gruntfile.js","package.json","README.md","decap-proxy","wrangler.jsonc","wrangler.toml"]

# SiteMap
sitemap:
    file: "/sitemap.xml"
    exclude:
        - "/atom.xml"
        - "/feed.xml"
        - "/feed/index.xml"
    include_posts:
        - "/writing/"
    change_frequency_name: "change_frequency"
    priority_name: "priority"

collections:
  photos:
    output: true
    permalink: /foto/:path/

defaults:
  - scope:
      path: ""
      type: "photos"
    values:
      layout: "photo"
