backend:
  name: github
  repo: forgingphotons/forgingphotons.github.io
  branch: main
  base_url: https://verceloauth-forgingphotons.vercel.app
  auth_endpoint: auth

site_url: https://forgingphotons.github.io
display_url: https://forgingphotons.github.io
locale: it

# Libreria media: Cloudinary (i file vengono caricati lì e nel repo resta solo l'indirizzo).
# cloud_name e api_key sono dati pubblici; il "secret" NON va mai inserito qui.
media_library:
  name: cloudinary
  config:
    cloud_name: lfvjdxxt
    api_key: "614921367466431"

# Cartella di riserva (foto già presenti nel repo)
media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  # ------------------------- FOTO -------------------------
  - name: "photos"
    label: "Foto"
    label_singular: "Foto"
    folder: "_photos"
    create: true
    extension: "md"
    slug: "{{slug}}"
    summary: "{{title}} · {{category}} · pos. {{position}}"
    sortable_fields: ["title", "category", "position", "shot_date"]
    fields:
      - { label: "Titolo", name: "title", widget: "string" }

      - label: "Galleria (categoria)"
        name: "category"
        widget: "select"
        options:
          - { label: "Nebulose", value: "nebulas" }
          - { label: "Galassie", value: "galaxies" }
          - { label: "Ammassi", value: "clusters" }
          - { label: "Sistema solare", value: "solar-system" }
          - { label: "Paesaggi", value: "landscapes" }
        hint: "La foto comparirà nella galleria scelta."

      - label: "Mostra nel carosello della home"
        name: "show_home"
        widget: "boolean"
        default: false
        required: false
        hint: "Se nessuna foto è spuntata, il carosello mostra tutte le foto. L'ordine segue il campo «Ordine in galleria»."

      - { label: "Immagine", name: "image", widget: "image", required: false, hint: "Obbligatoria per le foto. Per i video è facoltativa: se manca si usa la miniatura di YouTube o il primo fotogramma del video Cloudinary." }
      - label: "Video (link)"
        name: "video_url"
        widget: "string"
        required: false
        pattern: ['^(https?://|/)', "Incolla un indirizzo che inizia con https:// (oppure con / per un file del sito)."]
        hint: "Facoltativo. Link a un video YouTube o Vimeo, oppure a un file .mp4 ospitato altrove. Nella pagina della foto il video sostituisce l'immagine grande."
      - label: "Video (file caricato)"
        name: "video_file"
        widget: "file"
        required: false
        hint: "Facoltativo. Carica un MP4 (H.264) su Cloudinary, max 100 MB nel piano gratuito. Per video più grandi usa il campo «Video (link)» con YouTube o Vimeo. Se compili entrambi vale questo."
      - { label: "Testo alternativo", name: "alt", widget: "string", required: false, hint: "Breve descrizione per chi non vede l'immagine. Se vuoto si usa il titolo." }

      # --- Dettagli di scatto ---
      - { label: "Data di acquisizione", name: "shot_date", widget: "datetime", required: false, default: "", hint: "Facoltativa: se vuota, la data non viene mostrata." }
      - { label: "Luogo di scatto", name: "location", widget: "string", required: false }
      - { label: "Attrezzatura", name: "equipment", widget: "string", required: false }
      - { label: "Esposizione", name: "exposure", widget: "string", required: false }
      - label: "Informazioni tecniche"
        name: "technical_info"
        widget: "text"
        required: false
        hint: "Facoltativo, testo libero: una voce per riga. Es. Type: planetary nebula / Constellation: Hydra / Distance: 2,500 light years. Compare solo nella pagina della foto, non nell'anteprima in galleria."

      # --- Dimensione, forma e posizione nella galleria ---
      - label: "Dimensione in galleria"
        name: "display_size"
        widget: "select"
        default: "medium"
        options:
          - { label: "Piccola (1/3 della riga)", value: "small" }
          - { label: "Media (1/2 della riga)", value: "medium" }
          - { label: "Grande (2/3 della riga)", value: "large" }
          - { label: "In evidenza (riga intera)", value: "featured" }

      - label: "Forma del riquadro"
        name: "shape"
        widget: "select"
        default: "landscape"
        options:
          - { label: "Orizzontale (3:2)", value: "landscape" }
          - { label: "Verticale (4:5)", value: "portrait" }
          - { label: "Quadrata (1:1)", value: "square" }
          - { label: "Panoramica (21:9)", value: "panorama" }
        hint: "L'immagine viene ritagliata per riempire il riquadro."

      - label: "Ordine in galleria"
        name: "position"
        widget: "number"
        value_type: "int"
        default: 100
        hint: "Numero più basso = appare prima. Usa 10, 20, 30... per poter inserire foto in mezzo."

      - label: "Punto focale orizzontale"
        name: "focal_x"
        widget: "select"
        default: "center"
        required: false
        options:
          - { label: "Sinistra", value: "left" }
          - { label: "Centro", value: "center" }
          - { label: "Destra", value: "right" }

      - label: "Punto focale verticale"
        name: "focal_y"
        widget: "select"
        default: "center"
        required: false
        options:
          - { label: "Alto", value: "top" }
          - { label: "Centro", value: "center" }
          - { label: "Basso", value: "bottom" }

      - { label: "Descrizione", name: "body", widget: "markdown" }

  # ------------------------- PAGINE -------------------------
  - name: "pages"
    label: "Pagine"
    files:
      - label: "About"
        name: "about"
        file: "about/index.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
          - { label: "Attiva nel menu", name: "active", widget: "hidden", default: "about" }
          - { label: "Immagine di intestazione", name: "header-img", widget: "hidden", default: "img/about-bg.jpg" }
          - { label: "Titolo", name: "title", widget: "string" }
          - { label: "Sottotitolo", name: "description", widget: "string", required: false }
          - { label: "Testo", name: "body", widget: "markdown" }
